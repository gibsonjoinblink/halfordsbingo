<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halfords Bingo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff971f;
    --black: #313131;
    --dark: #1a1a1a;
    --card-bg: #222222;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --text: #f5f5f5;
    --muted: #888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── NOISE OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999;
  }

  /* ── STRIPE ACCENT ── */
  .stripe {
    height: 5px;
    background: repeating-linear-gradient(90deg, var(--orange) 0, var(--orange) 20px, var(--black) 20px, var(--black) 24px);
  }

  /* ── HEADER ── */
  header {
    padding: 28px 40px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2a2a2a;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-img {
    height: 40px;
    width: auto;
    display: block;
  }

  .logo-bingo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 4px;
    color: var(--text);
    border-left: 2px solid #3a3a3a;
    padding-left: 16px;
    line-height: 1;
  }

  .logo-bingo span { color: var(--orange); }

  .score-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .score-badge span {
    color: var(--orange);
    font-size: 1.4rem;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    padding: 16px 40px 0;
  }

  .progress-label {
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .progress-track {
    height: 6px;
    background: #2a2a2a;
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--orange), #ffb347);
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  .round-dots {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #2a2a2a;
    border: 2px solid #3a3a3a;
    transition: all 0.3s ease;
  }

  .dot.active { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 8px var(--orange); }
  .dot.done   { background: #444; border-color: #555; }

  /* ── MAIN STAGE ── */
  main {
    padding: 40px 20px 60px;
    max-width: 900px;
    margin: 0 auto;
  }

  .question-header {
    text-align: center;
    margin-bottom: 36px;
  }

  .round-tag {
    display: inline-block;
    background: var(--orange);
    color: var(--black);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 3px;
    padding: 4px 14px;
    border-radius: 2px;
    margin-bottom: 14px;
  }

  .question-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: 1px;
    line-height: 1.15;
    color: var(--text);
    max-width: 600px;
    margin: 0 auto;
  }

  /* ── CARDS ── */
  .cards-arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0;
    align-items: center;
    margin-bottom: 36px;
  }

  .vs-divider {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    color: var(--orange);
    text-align: center;
    padding: 0 16px;
    position: relative;
  }

  .vs-divider::before,
  .vs-divider::after {
    content: '';
    display: block;
    width: 2px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--orange), transparent);
    margin: 0 auto;
  }

  .flashcard {
    background: var(--card-bg);
    border: 2px solid #333;
    border-radius: 16px;
    padding: 36px 28px;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    position: relative;
    overflow: hidden;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
  }

  .flashcard::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,151,31,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .flashcard:hover:not(.disabled) {
    transform: translateY(-6px) scale(1.02);
    border-color: var(--orange);
    box-shadow: 0 20px 50px rgba(255,151,31,0.2), 0 0 0 1px var(--orange);
  }

  .flashcard.disabled { cursor: default; }

  .flashcard.correct {
    border-color: var(--correct);
    background: #1a2e1e;
    box-shadow: 0 0 40px rgba(46,204,113,0.25);
    animation: pulse-correct 0.5s ease;
  }

  .flashcard.wrong {
    border-color: var(--wrong);
    background: #2e1a1a;
    box-shadow: 0 0 40px rgba(231,76,60,0.25);
    animation: shake 0.4s ease;
  }

  .flashcard.reveal-correct {
    border-color: var(--correct);
    background: #1a2e1e;
  }

  @keyframes pulse-correct {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-8px); }
    40%     { transform: translateX(8px); }
    60%     { transform: translateX(-6px); }
    80%     { transform: translateX(6px); }
  }

  .card-emoji {
    font-size: 3rem;
    margin-bottom: 16px;
    line-height: 1;
  }

  .card-category {
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 8px;
  }

  .card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.3rem, 2.5vw, 1.8rem);
    letter-spacing: 1px;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .card-desc {
    font-size: 0.82rem;
    color: #aaa;
    line-height: 1.5;
  }

  .result-icon {
    position: absolute;
    top: 12px; right: 14px;
    font-size: 1.6rem;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .flashcard.correct .result-icon,
  .flashcard.wrong .result-icon,
  .flashcard.reveal-correct .result-icon {
    opacity: 1;
  }

  /* ── FEEDBACK ── */
  .feedback-bar {
    min-height: 64px;
    background: #1c1c1c;
    border: 1px solid #2e2e2e;
    border-radius: 10px;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.95rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
    margin-bottom: 28px;
  }

  .feedback-bar.show {
    opacity: 1;
    transform: translateY(0);
  }

  .feedback-icon { font-size: 1.6rem; flex-shrink: 0; }

  .feedback-text strong { color: var(--orange); }

  /* ── NEXT BUTTON ── */
  .next-btn {
    display: block;
    margin: 0 auto;
    background: var(--orange);
    color: var(--black);
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 3px;
    padding: 14px 48px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    opacity: 0;
    pointer-events: none;
  }

  .next-btn.show {
    opacity: 1;
    pointer-events: all;
    animation: btn-appear 0.35s ease;
  }

  .next-btn:hover { transform: scale(1.04); box-shadow: 0 8px 24px rgba(255,151,31,0.35); }

  @keyframes btn-appear {
    from { transform: translateY(8px) scale(0.97); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* ── SCREENS ── */
  .screen {
    display: none;
    animation: fade-in 0.5s ease;
  }

  .screen.active { display: block; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── START SCREEN ── */
  #start-screen {
    max-width: 620px;
    margin: 60px auto 0;
    text-align: center;
    padding: 0 20px;
  }

  .start-badge {
    display: inline-block;
    border: 1px solid var(--orange);
    color: var(--orange);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 4px;
    font-size: 0.8rem;
    padding: 5px 18px;
    border-radius: 40px;
    margin-bottom: 22px;
  }

  .start-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 10vw, 6rem);
    line-height: 0.95;
    margin-bottom: 20px;
  }

  .start-title span { color: var(--orange); }

  .start-sub {
    font-size: 1rem;
    color: #aaa;
    max-width: 440px;
    margin: 0 auto 36px;
    line-height: 1.6;
  }

  .start-btn {
    background: var(--orange);
    color: var(--black);
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 4px;
    padding: 16px 60px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-bottom: 18px;
  }

  .start-btn:hover { transform: scale(1.04); box-shadow: 0 10px 30px rgba(255,151,31,0.4); }

  .start-rules {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 36px;
    flex-wrap: wrap;
  }

  .rule-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    padding: 8px 16px;
    border-radius: 40px;
  }

  .rule-chip span { font-size: 1.1rem; }

  /* ── END SCREEN ── */
  #end-screen {
    max-width: 620px;
    margin: 60px auto 0;
    text-align: center;
    padding: 0 20px;
  }

  .end-trophy {
    font-size: 5rem;
    margin-bottom: 16px;
    animation: bounce 0.8s ease;
  }

  @keyframes bounce {
    0%   { transform: translateY(-30px); opacity: 0; }
    60%  { transform: translateY(8px); }
    100% { transform: translateY(0); opacity: 1; }
  }

  .end-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    line-height: 1;
    margin-bottom: 10px;
  }

  .end-title span { color: var(--orange); }

  .score-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 5rem;
    color: var(--orange);
    line-height: 1;
    margin: 16px 0 4px;
  }

  .score-display small {
    font-size: 1.4rem;
    color: var(--muted);
  }

  .end-msg {
    font-size: 1rem;
    color: #aaa;
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .replay-btn {
    background: var(--orange);
    color: var(--black);
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 4px;
    padding: 14px 50px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .replay-btn:hover { transform: scale(1.04); box-shadow: 0 10px 30px rgba(255,151,31,0.4); }

  .score-breakdown {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 24px 0;
    flex-wrap: wrap;
  }

  .breakdown-item {
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .breakdown-item strong {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--text);
    line-height: 1;
  }

  /* ── CARD ENTER ANIMATION ── */
  .flashcard {
    animation: card-in 0.4s ease both;
  }
  .flashcard:nth-child(1) { animation-delay: 0.05s; }
  .flashcard:nth-child(3) { animation-delay: 0.15s; }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (max-width: 600px) {
    .cards-arena {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
    }
    .vs-divider::before, .vs-divider::after { height: 20px; }
    header { padding: 16px 20px; }
    .progress-wrap { padding: 12px 20px 0; }
  }
</style>
</head>

<script>
// ═══════════════════════════════════════════════
// QUESTION BANK — 10 questions, 5 played per game
// correct: 'A' or 'B' — indicates which card is the answer
// ═══════════════════════════════════════════════
const ALL_QUESTIONS = [
  {
    question: "Which product is part of Halfords' new EV charging range?",
    correct: 'A',
    a: { emoji: '⚡', cat: 'EV & Electric', title: 'HyperVolt Home 3.0 EV Charger', desc: 'Smart 7.4kW home wallbox with app control, solar-ready compatibility and 5-year warranty.' },
    b: { emoji: '🔌', cat: 'Car Accessories', title: 'USB-C Triple Car Adaptor', desc: 'Three-port in-car charger with fast-charge USB-C, supports 30W output for phones and tablets.' }
  },
  {
    question: "Which item belongs to Halfords' new Premium Cycling range?",
    correct: 'B',
    a: { emoji: '🔧', cat: 'Tools', title: 'Halfords Advanced 3/8\" Drive Ratchet', desc: 'Professional-grade 72-tooth ratchet with ergonomic rubberised grip and lifetime guarantee.' },
    b: { emoji: '🚲', cat: 'Cycling', title: 'Carrera Virago E-Bike 2024', desc: 'Lightweight alloy e-bike with 250W mid-drive motor, Shimano 8-speed gears and 70-mile range.' }
  },
  {
    question: "Which product is from Halfords' new In-Car Tech range?",
    correct: 'A',
    a: { emoji: '📸', cat: 'In-Car Tech', title: 'Nextbase 622GW Dash Cam', desc: '4K dash cam with Emergency SOS, what3words location sharing and Amazon Alexa built in.' },
    b: { emoji: '🛞', cat: 'Tyres', title: 'Goodyear EfficientGrip Performance 2', desc: 'Summer tyre rated A for fuel efficiency and wet braking — available in full range at Halfords Autocentres.' }
  },
  {
    question: "Which belongs to Halfords' new Garage & Workshop range?",
    correct: 'B',
    a: { emoji: '🌡️', cat: 'Car Care', title: 'Halfords Antifreeze & Coolant Concentrate', desc: 'OAT formula protects down to −37°C, compatible with all makes. Sold in 1L and 5L bottles.' },
    b: { emoji: '🔩', cat: 'Workshop', title: 'Halfords 200-Piece Mechanics Tool Set', desc: 'Chrome vanadium socket set with 1/4\", 3/8\" and 1/2\" drives in a heavy-duty carry case.' }
  },
  {
    question: "Which product is part of Halfords' new Kids Cycling collection?",
    correct: 'A',
    a: { emoji: '🧒', cat: 'Kids Cycling', title: 'Apollo Honey Bee 16\" Kids Bike', desc: 'Lightweight steel frame, easy-reach brakes and stabilisers included — perfect for ages 4–6.' },
    b: { emoji: '🏁', cat: 'Motorsport', title: 'Ring Automotive Jump Starter 1500A', desc: 'Compact lithium jump starter with 1500A peak current, USB power bank and LED torch.' }
  },
  {
    question: "Which is part of Halfords' new Electric Scooter range?",
    correct: 'B',
    a: { emoji: '🧰', cat: 'Hand Tools', title: 'Draper 500W Heat Gun', desc: 'Variable temperature heat gun with two settings and airflow nozzle — ideal for DIY stripping and bending.' },
    b: { emoji: '🛴', cat: 'Electric Scooters', title: 'Segway Ninebot E2 Plus', desc: '300W motor, 25km range and 25km/h top speed — foldable design with LED lighting.' }
  },
  {
    question: "Which item is in Halfords' new Smart Bike Accessories range?",
    correct: 'A',
    a: { emoji: '📡', cat: 'Smart Cycling', title: 'Garmin Edge 540 GPS Cycle Computer', desc: 'Solar-charging GPS with ClimbPro, real-time stamina tracking and full navigation mapping.' },
    b: { emoji: '🪣', cat: 'Car Cleaning', title: 'Autoglym Bodywork Shampoo Conditioner 500ml', desc: 'pH-balanced formula lifts dirt and leaves a shine-enhancing conditioner layer in one wash.' }
  },
  {
    question: "Which product is from Halfords' new Car Safety & Security range?",
    correct: 'B',
    a: { emoji: '🚗', cat: 'Car Care', title: 'Turtle Wax Hybrid Solutions Ceramic Spray', desc: 'SiO2 ceramic spray wax delivering up to 12 months of paint protection with a showroom finish.' },
    b: { emoji: '🚨', cat: 'Car Safety', title: 'Halfords Approved Thatcham Cat 6 Tracker', desc: 'Covert GPS tracker with Secure Operating Centre monitoring and stolen vehicle recovery.' }
  },
  {
    question: "Which belongs to Halfords' new Cycling Helmets & Safety range?",
    correct: 'A',
    a: { emoji: '⛑️', cat: 'Cycling Safety', title: 'Giro Syntax MIPS Road Helmet', desc: 'MIPS-equipped road helmet with 25 vents, adjustable In-Form fit system and EN1078 certified.' },
    b: { emoji: '🔋', cat: 'EV & Electric', title: 'Ring Jump Starter Pack RSC806', desc: 'Compact 12V lithium starter with 800A peak current, LED torch and built-in USB power bank.' }
  },
  {
    question: "Which product is from Halfords' new Premium Wiper Blade range?",
    correct: 'B',
    a: { emoji: '🎒', cat: 'Cycling Bags', title: 'Altura Vortex Commuter Backpack 25L', desc: 'Waterproof cycle backpack with rear LED light, laptop sleeve and reflective detailing.' },
    b: { emoji: '🌧️', cat: 'Wiper Blades', title: 'Bosch Aerotwin A978S Wiper Blades', desc: 'Flat-blade wipers with patented spring rail for even pressure, no streaking and fit-in-seconds clip.' }
  }
];

let questions = [];
let currentRound = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  questions = shuffle(ALL_QUESTIONS).slice(0, 5);
  currentRound = 0;
  score = 0;
  document.getElementById('header-score').textContent = '0';

  // Build dots
  const dotsEl = document.getElementById('round-dots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.id = 'dot-' + i;
    dotsEl.appendChild(d);
  }

  showScreen('game-screen');
  loadRound();
}

function loadRound() {
  answered = false;
  const q = questions[currentRound];

  // Header
  document.getElementById('round-tag').textContent = `ROUND ${currentRound + 1} OF 5`;
  document.getElementById('question-text').textContent = q.question;

  // Progress
  document.getElementById('progress-fill').style.width = (currentRound / 5 * 100) + '%';

  // Dots
  for (let i = 0; i < 5; i++) {
    const d = document.getElementById('dot-' + i);
    d.className = 'dot' + (i < currentRound ? ' done' : i === currentRound ? ' active' : '');
  }

  // Possibly swap card sides randomly
  const swapped = Math.random() > 0.5;
  const left  = swapped ? q.b : q.a;
  const right = swapped ? q.a : q.b;
  const leftSide  = swapped ? 'B' : 'A';
  const rightSide = swapped ? 'A' : 'B';

  fillCard('a', left,  leftSide);
  fillCard('b', right, rightSide);

  // Reset cards
  const cardA = document.getElementById('card-a');
  const cardB = document.getElementById('card-b');
  cardA.className = 'flashcard';
  cardB.className = 'flashcard';
  cardA.onclick = () => choose(leftSide);
  cardB.onclick = () => choose(rightSide);

  document.getElementById('icon-a').textContent = '';
  document.getElementById('icon-b').textContent = '';

  // Reset feedback
  const fb = document.getElementById('feedback-bar');
  fb.className = 'feedback-bar';

  const btn = document.getElementById('next-btn');
  btn.className = 'next-btn';
  btn.textContent = currentRound < 4 ? 'NEXT ROUND →' : 'SEE RESULTS →';
}

function fillCard(side, data, sideKey) {
  document.getElementById('emoji-' + side).textContent = data.emoji;
  document.getElementById('cat-' + side).textContent = data.cat;
  document.getElementById('title-' + side).textContent = data.title;
  document.getElementById('desc-' + side).textContent = data.desc;
  // store which answer key this card represents
  document.getElementById('card-' + side).dataset.key = sideKey;
}

function choose(side) {
  if (answered) return;
  answered = true;

  const q = questions[currentRound];
  const cardA = document.getElementById('card-a');
  const cardB = document.getElementById('card-b');

  // Determine which DOM card was chosen
  const chosenCard = (cardA.dataset.key === side) ? cardA : cardB;
  const otherCard  = (cardA.dataset.key === side) ? cardB : cardA;
  const chosenIcon = (cardA.dataset.key === side) ? document.getElementById('icon-a') : document.getElementById('icon-b');
  const otherIcon  = (cardA.dataset.key === side) ? document.getElementById('icon-b') : document.getElementById('icon-a');

  // Which card is correct?
  const correctCard = (cardA.dataset.key === q.correct) ? cardA : cardB;
  const correctIsChosen = (chosenCard === correctCard);

  cardA.classList.add('disabled');
  cardB.classList.add('disabled');
  cardA.onclick = null;
  cardB.onclick = null;

  const fb = document.getElementById('feedback-bar');
  const fbIcon = document.getElementById('feedback-icon');
  const fbText = document.getElementById('feedback-text');

  if (correctIsChosen) {
    score++;
    document.getElementById('header-score').textContent = score;
    chosenCard.classList.add('correct');
    chosenIcon.textContent = '✅';
    fbIcon.textContent = '🎉';
    fbText.innerHTML = `<strong>Correct!</strong> ${getCorrectFact(q)}`;
  } else {
    chosenCard.classList.add('wrong');
    chosenIcon.textContent = '❌';
    correctCard.classList.add('reveal-correct');
    otherIcon.textContent = '✅';
    fbIcon.textContent = '😬';
    fbText.innerHTML = `<strong>Not quite!</strong> ${getWrongFact(q)}`;
  }

  fb.classList.add('show');
  document.getElementById('next-btn').classList.add('show');
}

function getCorrectFact(q) {
  const facts = [
    `The ${q[q.correct === 'A' ? 'a' : 'b'].title} is indeed part of Halfords' latest range. Great product knowledge!`,
    `Spot on — the ${q[q.correct === 'A' ? 'a' : 'b'].title} is one of the newest additions to the Halfords lineup.`,
    `You nailed it! The ${q[q.correct === 'A' ? 'a' : 'b'].title} is from Halfords' updated collection.`
  ];
  return facts[Math.floor(Math.random() * facts.length)];
}

function getWrongFact(q) {
  const correct = q[q.correct === 'A' ? 'a' : 'b'];
  return `The correct answer was the <strong>${correct.title}</strong>. ${correct.desc}`;
}

function nextRound() {
  currentRound++;
  if (currentRound >= 5) {
    endGame();
  } else {
    // Re-animate cards
    const arena = document.getElementById('cards-arena');
    const cards = arena.querySelectorAll('.flashcard');
    cards.forEach(c => {
      c.style.animation = 'none';
      c.offsetHeight; // reflow
      c.style.animation = '';
    });
    loadRound();
  }
}

function endGame() {
  showScreen('end-screen');

  const pct = Math.round(score / 5 * 100);
  document.getElementById('final-score').innerHTML = `${score} <small>/ 5</small>`;
  document.getElementById('bd-correct').textContent = score;
  document.getElementById('bd-wrong').textContent = 5 - score;
  document.getElementById('bd-pct').textContent = pct + '%';

  // Progress bar to 100%
  document.getElementById('progress-fill').style.width = '100%';

  const msgs = {
    5: { trophy: '🏆', msg: "Perfect score! You know the Halfords range inside out — the team would be impressed!" },
    4: { trophy: '🥇', msg: "Excellent! You've got a strong handle on the Halfords product range. Just one to brush up on!" },
    3: { trophy: '🥈', msg: "Solid effort! Half the battle is knowing your range — keep exploring what's new at Halfords." },
    2: { trophy: '🥉', msg: "Getting there! There's some brilliant new kit at Halfords waiting to be discovered." },
    1: { trophy: '😅', msg: "Room to grow! Why not browse the latest ranges in-store or online and try again?" },
    0: { trophy: '😬', msg: "Looks like a trip to Halfords is in order! Explore the new ranges and come back for the rematch." }
  };

  const result = msgs[score];
  document.getElementById('end-trophy').textContent = result.trophy;
  document.getElementById('end-msg').textContent = result.msg;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
